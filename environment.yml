name: course
channels:
  - conda-forge
dependencies:
  # Core packages
  - numpy=1.23.1
  - pandas=1.4.3
  - scipy=1.9.0
  - lxml=4.9.1
  - requests=2.28.1
  - pillow=9.2.0
  - pyarrow=9.0.0
  - linkify-it-py=2.0.0

  # Plotting & visualization
  - matplotlib=3.5.3
  - seaborn=0.11.2
  - cmasher=1.6.3

  # Machine learning
  - scikit-learn=1.1.2
  - xgboost=1.6.2
  - tensorflow=2.9.1
  - umap-learn=0.5.3

  # Notebook
  - jupyter=1.0.0

  # Pip itself
  - pip=22.2.2

  # Pip-only packages
  - pip:
      - sphinx==5.1.1
      - sphinx_rtd_theme==1.0.0
      - sphinx-gallery==0.11.0
      - adjustText
      - highlight-text
      - kloppy
      - mplsoccer==1.1.3
      - sphinxcontrib-youtube
      - myst-parser==0.18.1
      - ruptures
